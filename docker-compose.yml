services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow_dev_password
      POSTGRES_DB: civicflow
    ports:
      - "5433:5432"
    volumes:
      - civicflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  civicflow_data:
